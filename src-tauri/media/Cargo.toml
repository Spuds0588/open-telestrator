[package]
name = "telestrator-media"
version = "0.1.0"
edition = "2021"
publish = false
description = "RTMP publishing for the Open Telestrator desktop build"

[lib]
name = "telestrator_media"
path = "src/lib.rs"

# Two dependencies, and only because TLS cannot be hand-rolled: the protocol,
# the container and the timing are all hand-rolled so the crate can be tested
# without a server, but no sane amount of our own code replaces a TLS stack and a
# trust store. Facebook Live, Instagram and LinkedIn publish their ingest over
# TLS only (`rtmps://`), so without these three platforms cannot be reached at
# all. See src/tls.rs for what the choice buys and what it deliberately does not.
#
# `ring` rather than rustls's default aws-lc-rs provider: ring builds with a C
# compiler and nothing else, where aws-lc-rs wants cmake or ninja on the builder.
# `webpki-roots` carries Mozilla's roots in the binary, so a platform's
# certificate is trusted the same way on every machine and no system trust store
# is consulted.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# A certificate generator, for tests only. The TLS tests stand up a real TLS
# server on loopback with a certificate this generated in-process, so the
# handshake, the verification and the record framing are exercised for real
# rather than mocked. It never reaches a shipped build.
[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
