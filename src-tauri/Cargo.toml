[package]
name = "open-telestrator"
version = "0.1.1"
edition = "2021"
publish = false
description = "Open Telestrator desktop build"
rust-version = "1.77"

# The media crate is a member so it can be tested on its own, without Tauri's
# dependency tree in the way: `cargo test -p telestrator-media` takes a second.
[workspace]
members = ["media"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# The shell is a library with a two-line binary in front of it: Android needs a
# function its activity can call, and `mobile_entry_point` has to sit on a
# function in a library. The desktop build is unchanged by it.
name = "open_telestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Handing a release page to the system's browser is the whole of what this app
# does about a new version: it ships as a standalone executable, so there is no
# installer to fetch and no signature to verify. The opener works on a phone too,
# which is the other place a build has no browser chrome of its own.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telestrator-media = { path = "media" }

# A tray menu and a global shortcut are desktop ideas, and the shortcut crate is
# not built for Android at all. Scoping it by target is what lets one shell serve
# both without a second copy of anything.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-global-shortcut = "2"

[features]
# Used by `tauri build` so the app loads the bundled frontend rather than a dev
# server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
